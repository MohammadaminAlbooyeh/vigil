version: '3.8'

services:
  api:
    build: .
    container_name: income-prediction-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      WORKERS: 4
      PYTHONUNBUFFERED: 1
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - income-prediction-net

networks:
  income-prediction-net:
    driver: bridge
