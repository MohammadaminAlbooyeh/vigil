# Sentinel-X MQTT Broker Configuration

# Listening ports
listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol mqtt

# Persistence
persistence true
persistence_location /mosquitto/data
persistence_delay 5

# Logging
log_dest stdout
log_type all
log_timestamp true

# Security
allow_anonymous true

# Limits
max_connections 1000
max_inflight_messages 0
max_queued_messages 0

# Keep alive
keepalive 60

# Topics
topic sentinel
pattern sentinel write