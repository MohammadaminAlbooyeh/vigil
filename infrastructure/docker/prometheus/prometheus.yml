# Sentinel-X Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sentinel-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'mosquitto'
    static_configs:
      - targets: ['mosquitto:1883']

alerting:
  alert_rules:
    - /etc/prometheus/alerts.yaml

rule_files:
  - /etc/prometheus/rules/*.yml