apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-backend
  labels:
    app: sentinel-x
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-x
  template:
    metadata:
      labels:
        app: sentinel-x
    spec:
      containers:
        - name: backend
          image: sentinel-x/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://sentinel:sentinel123@postgres:5432/sentinel-x"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MQTT_BROKER
              value: "mosquitto"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-backend
spec:
  selector:
    app: sentinel-x
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP